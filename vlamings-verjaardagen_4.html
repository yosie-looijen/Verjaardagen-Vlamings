<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Vlamings — Verjaardagen</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     CONFIGURATIE — dit is het enige stuk dat je zelf hoeft aan te passen
     ============================================================ */

  :root{
    /* ---- Palet: geïnspireerd op het veld en de kwekerij ---- */
    --cream:      #F6F1E4;   /* achtergrond, warm papier */
    --forest:     #223A2C;   /* diepgroen, hoofdtekst */
    --forest-70:  #223A2Cb3;
    --gold:       #C79A2E;   /* oogstgoud, accent */
    --sage:       #8FA37E;   /* zachtgroen, secundair */
    --rust:       #8B5A2B;   /* aarde, kleine details */
    --paper:      #FFFDF6;   /* lichte kaart-ondergrond */
    --line:       #22392c26;

    --font-display: 'Fraunces', serif;
    --font-body: 'Work Sans', sans-serif;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background: var(--cream);
    overflow:hidden;
    font-family: var(--font-body);
    color: var(--forest);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  .stage{
    position:relative;
    height:100vh; width:100vw;
    display:flex; align-items:center; justify-content:center;
    padding: 4vh 5vw;
  }

  /* subtiele veldlijnen op de achtergrond, verwijst naar akkers/rijenteelt */
  .stage::before{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(
      100deg,
      transparent 0px,
      transparent 78px,
      var(--line) 78px,
      var(--line) 79px
    );
    opacity:.6;
    pointer-events:none;
  }

  /* ---------- Logo's: Vlamings + Kiemkracht ---------- */
  .logos-row{
    position:absolute;
    top: 4.5vh; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap: 1.6vw;
    animation: logos-in 900ms cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes logos-in{
    from{ opacity:0; transform: translateY(-10px) translateX(-50%) scale(.92); }
    to{ opacity:1; transform: translateY(0) translateX(-50%) scale(1); }
  }
  .logos-row img{
    height: clamp(34px, 4vw, 58px);
    width: auto;
    display:block;
  }
  .logos-row .divider{
    width:1px;
    height: clamp(22px, 2.6vw, 38px);
    background: var(--line);
  }


  /* ================= JARIG-WEERGAVE ================= */

  #view-birthday{
    display:none;
    flex-direction:column;
    align-items:center;
    text-align:center;
    max-width: 78vw;
    animation: rise-in 700ms cubic-bezier(.2,.8,.2,1) both;
    animation-delay: 150ms;
  }
  @keyframes rise-in{
    from{ opacity:0; transform: translateY(22px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .eyebrow{
    font-size: clamp(14px, 1.4vw, 22px);
    font-weight:600;
    letter-spacing:.12em;
    text-transform: none;
    color: var(--rust);
    margin-bottom: 1.4vh;
  }

  .names-wrap{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:baseline;
    gap: 0 .55em;
    row-gap: .1em;
  }

  .name{
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 600;
    font-size: clamp(46px, 7.4vw, 128px);
    line-height:1.05;
    color: var(--forest);
  }
  .name-sep{
    font-family: var(--font-display);
    font-style: normal;
    font-weight: 400;
    color: var(--sage);
    font-size: clamp(46px, 7.4vw, 128px);
  }

  .subline{
    margin-top: 2.6vh;
    font-size: clamp(16px, 1.8vw, 28px);
    color: var(--forest-70);
  }
  .subline strong{
    color: var(--forest);
    font-weight:600;
  }

  .locaties{
    margin-top: 1vh;
    font-size: clamp(13px, 1.2vw, 18px);
    letter-spacing:.06em;
    color: var(--rust);
  }

  .photos{
    display:flex; justify-content:center; gap: 1.6vw;
    margin-top: 3.2vh;
    flex-wrap:wrap;
  }
  .photo{
    width: clamp(70px, 8vw, 140px);
    height: clamp(70px, 8vw, 140px);
    border-radius:50%;
    object-fit:cover;
    border: 4px solid var(--paper);
    box-shadow: 0 0 0 2px var(--gold);
    background: var(--sage);
  }

  /* ================= GEEN JARIGE-WEERGAVE ================= */

  #view-empty{
    display:none;
    flex-direction:column;
    align-items:center;
    text-align:center;
    animation: rise-in 700ms cubic-bezier(.2,.8,.2,1) both;
    animation-delay: 150ms;
  }
  #view-empty .eyebrow{ color: var(--sage); }
  #view-empty .name{
    font-size: clamp(30px, 4.4vw, 66px);
    color: var(--forest-70);
  }
  #view-empty .subline{
    max-width: 42ch;
  }
  .next-up{
    margin-top: 3.4vh;
    padding-top: 2.2vh;
    border-top: 1px solid var(--line);
    font-size: clamp(14px, 1.3vw, 19px);
    color: var(--forest-70);
  }
  .next-up strong{ color: var(--forest); font-weight:600; }

  .datestamp{
    position:absolute;
    bottom: 4vh; left:50%; transform:translateX(-50%);
    font-size: clamp(12px, 1.1vw, 16px);
    letter-spacing:.08em;
    color: var(--forest-70);
    text-transform: capitalize;
  }

</style>
</head>

  <div id="view-birthday">
    <div class="eyebrow">Vandaag jarig</div>
    <div class="names-wrap" id="names-wrap"></div>
    <div class="photos" id="photos-wrap"></div>
    <div class="subline">Van harte gefeliciteerd!</div>
    <div class="locaties" id="locaties"></div>
  </div>

  <div id="view-empty">
    <div class="eyebrow">Vandaag</div>
    <div class="name">Geen jarigen vandaag</div>
    <div class="next-up" id="next-up"></div>
  </div>

  <div class="datestamp" id="datestamp"></div>

</div>

<script>
/* ============================================================
   INSTELLINGEN — pas alleen dit blok aan
   ============================================================

   1. Zet in Google Sheets deze kolommen (exacte namen, hoofdletter maakt niet uit):
        Naam | Verjaardag | Vestiging | Foto

      - Naam:        bv. "Jan Jansen"
      - Verjaardag:  alleen dag en maand, bv. 14-03  of  14/03 (geen jaartal nodig)
      - Vestiging:   optioneel, bv. "De Mortel"
      - Foto:        optioneel, directe afbeeldings-URL

   2. Bestand -> Delen -> Publiceren op web -> kies het tabblad ->
      formaat "Kommagescheiden waarden (.csv)" -> Publiceren.
      Plak die link hieronder bij CSV_URL.

   3. Zolang CSV_URL leeg/placeholder is, draait de pagina op
      voorbeelddata zodat je het ontwerp nu al kan bekijken.
   ============================================================ */

  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSjkXzm8RgytTH3ouE8wIfDy9tLmq0VhqgjmVcNRA0Ht0hT2RLCaM3Js1Q9356wBwyAW7pTUqZqGQOA/pub?output=csv";

  const REFRESH_MINUTES = 30; // hoe vaak de sheet opnieuw wordt opgehaald

  // Voorbeelddata, alleen gebruikt zolang CSV_URL niet is ingevuld
  const DEMO_ROWS = [
    { naam: "Jan Jansen", dag: new Date().getDate(), maand: new Date().getMonth() + 1, vestiging: "De Mortel", foto: "" },
    { naam: "Marieke de Groot", dag: 12, maand: 4, vestiging: "Steenbergen", foto: "" },
    { naam: "Tom Verhoeven", dag: 3, maand: 9, vestiging: "Kiemkracht", foto: "" }
  ];

/* ============================================================
   Logica hieronder hoef je niet aan te passen
   ============================================================ */

  const monthsNL = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
  const daysNL = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];

  function stampDate(){
    const now = new Date();
    document.getElementById('datestamp').textContent =
      `${daysNL[now.getDay()]} ${now.getDate()} ${monthsNL[now.getMonth()]}`;
  }

  function parseCSV(text){
    const rows = [];
    const lines = text.replace(/\r/g,"").split("\n").filter(l => l.trim().length);
    if(!lines.length) return rows;

    const splitLine = (line) => {
      const out = []; let cur = ""; let inQuotes = false;
      for(let i=0;i<line.length;i++){
        const c = line[i];
        if(c === '"'){ inQuotes = !inQuotes; continue; }
        if(c === ',' && !inQuotes){ out.push(cur); cur = ""; continue; }
        cur += c;
      }
      out.push(cur);
      return out.map(s => s.trim());
    };

    const header = splitLine(lines[0]).map(h => h.toLowerCase());
    const idx = (name) => header.findIndex(h => h.includes(name));
    const iNaam = idx("naam");
    const iDatum = idx("verjaar") >= 0 ? idx("verjaar") : (idx("geboorte") >= 0 ? idx("geboorte") : idx("datum"));
    const iVest = idx("vestig"); const iFoto = idx("foto");

    for(let i=1;i<lines.length;i++){
      const cols = splitLine(lines[i]);
      if(!cols[iNaam]) continue;
      const datumRaw = (cols[iDatum] || "").trim();
      const m = datumRaw.match(/(\d{1,2})[-\/](\d{1,2})/);
      if(!m) continue;
      rows.push({
        naam: cols[iNaam],
        dag: parseInt(m[1],10),
        maand: parseInt(m[2],10),
        vestiging: iVest >= 0 ? (cols[iVest] || "") : "",
        foto: iFoto >= 0 ? (cols[iFoto] || "") : ""
      });
    }
    return rows;
  }

  function render(rows){
    const today = new Date();
    const todays = rows.filter(r => r.dag === today.getDate() && r.maand === (today.getMonth()+1));

    const birthdayView = document.getElementById('view-birthday');
    const emptyView = document.getElementById('view-empty');

    if(todays.length){
      birthdayView.style.display = 'flex';
      emptyView.style.display = 'none';

      const namesWrap = document.getElementById('names-wrap');
      namesWrap.innerHTML = todays.map((r,i) => {
        const sep = i < todays.length - 1 ? '<span class="name-sep">&amp;</span>' : '';
        return `<span class="name">${r.naam}</span>${sep}`;
      }).join(' ');

      const photosWrap = document.getElementById('photos-wrap');
      const withPhotos = todays.filter(r => r.foto);
      photosWrap.innerHTML = withPhotos.map(r => `<img class="photo" src="${r.foto}" alt="${r.naam}">`).join('');

      const locs = [...new Set(todays.map(r => r.vestiging).filter(Boolean))];
      document.getElementById('locaties').textContent = locs.join(' · ');

    } else {
      birthdayView.style.display = 'none';
      emptyView.style.display = 'flex';

      // eerstvolgende verjaardag zoeken (aardig extraatje, geen harde eis)
      const upcoming = rows
        .map(r => {
          const d = new Date(today.getFullYear(), r.maand - 1, r.dag);
          if(d < new Date(today.getFullYear(), today.getMonth(), today.getDate())) d.setFullYear(d.getFullYear()+1);
          return { ...r, when: d };
        })
        .sort((a,b) => a.when - b.when)[0];

      const nextUp = document.getElementById('next-up');
      if(upcoming){
        nextUp.innerHTML = `Eerstvolgende: <strong>${upcoming.naam}</strong> op ${upcoming.when.getDate()} ${monthsNL[upcoming.when.getMonth()]}`;
      } else {
        nextUp.innerHTML = '';
      }
    }
  }

  async function loadData(){
    stampDate();
    if(!CSV_URL || CSV_URL.indexOf("PLAK_HIER") === 0){
      render(DEMO_ROWS);
      return;
    }
    try{
      const res = await fetch(CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + 'cachebust=' + Date.now());
      const text = await res.text();
      const rows = parseCSV(text);
      render(rows.length ? rows : DEMO_ROWS);
    }catch(e){
      render(DEMO_ROWS);
    }
  }

  loadData();
  setInterval(loadData, REFRESH_MINUTES * 60 * 1000);
  setInterval(stampDate, 60 * 1000);
</script>
